<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARGLOW / USOTSUKI - オタクコール練習アプリ</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', '"Montserrat"', 'sans-serif'],
          },
          colors: {
            bmsg: {
              gold: '#ffd700',
              accent: '#ff2d55',
              purple: '#9d4edd',
              darkBg: '#0b0c10',
              cardBg: '#12141c',
            }
          },
          animation: {
            'pulse-fast': 'pulse 0.8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-short': 'bounceShort 0.5s ease-in-out infinite alternate',
            'glow': 'glow 2s infinite ease-in-out',
          },
          keyframes: {
            bounceShort: {
              '0%': { transform: 'translateY(0)' },
              '100%': { transform: 'translateY(-6px)' }
            },
            glow: {
              '0%, 100%': { boxShadow: '0 0 15px rgba(255, 45, 85, 0.4)' },
              '50%': { boxShadow: '0 0 30px rgba(255, 215, 0, 0.8)' }
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #08090c;
      color: #ffffff;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 45, 85, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(157, 78, 221, 0.12) 0%, transparent 50%);
      background-attachment: fixed;
    }

    /* Custom Scrollbar for Timeline */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 215, 0, 0.3);
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 215, 0, 0.6);
    }

    .glass-panel {
      background: rgba(18, 20, 28, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .active-call-card {
      border-color: #ffd700 !important;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 45, 85, 0.2)) !important;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }

    .upcoming-call-card {
      border-color: rgba(255, 45, 85, 0.5) !important;
      background: rgba(255, 45, 85, 0.08) !important;
    }

    /* Text Glow Effect */
    .glow-text-gold {
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.8), 0 0 24px rgba(255, 45, 85, 0.5);
    }

    .glow-text-pink {
      text-shadow: 0 0 12px rgba(255, 45, 85, 0.8);
    }
  </style>
</head>
<body class="min-h-screen pb-12 antialiased selection:bg-bmsg-accent selection:text-white">

  <header class="w-full border-b border-white/10 glass-panel sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-bmsg-accent to-bmsg-gold flex items-center justify-center font-black text-black text-lg shadow-lg">
          <i class="fa-solid fa-bullhorn text-xs"></i>
        </div>
        <div>
          <h1 class="font-black text-sm md:text-base bg-gradient-to-r from-white via-bmsg-gold to-bmsg-accent bg-clip-text text-transparent leading-tight">
            オタクコール練習アプリ
          </h1>
          <p class="text-[10px] text-gray-400 font-bold tracking-wider">STARGLOW / USOTSUKI</p>
        </div>
      </div>
      
      <!-- Speed / Practice Mode Toggles -->
      <div class="flex items-center space-x-2">
        <label for="speed-select" class="text-xs text-gray-300 font-bold hidden sm:inline"><i class="fa-solid fa-gauge-high mr-1"></i>再生速度:</label>
        <select id="speed-select" onchange="changeSpeed(this.value)" class="bg-black/60 border border-white/20 text-xs font-bold text-bmsg-gold rounded-lg px-2 py-1.5 focus:outline-none focus:border-bmsg-gold cursor-pointer">
          <option value="0.75">0.75x (ゆっくり練習)</option>
          <option value="1.0" selected>1.0x (通常スピード)</option>
          <option value="1.25">1.25x (速め)</option>
        </select>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3 sm:px-4 mt-4 space-y-4">

    <!-- Official YouTube Contribution Notice Banner -->
    <div class="bg-gradient-to-r from-red-950/60 via-purple-950/40 to-black/80 border border-red-500/40 rounded-2xl p-3 sm:p-4 text-center shadow-lg relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 text-red-500/10 text-8xl pointer-events-none">
        <i class="fa-brands fa-youtube"></i>
      </div>
      <div class="relative z-10 flex items-center justify-center space-x-2 text-xs sm:text-sm font-bold text-red-200">
        <i class="fa-brands fa-youtube text-red-500 text-lg animate-pulse"></i>
        <span>このアプリでの再生は<strong class="text-bmsg-gold underline underline-offset-4 decoration-red-500">YouTube公式の再生数（MV回し）に直接貢献</strong>します！🔥</span>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
      
      <div class="lg:col-span-7 space-y-4">
        
        <!-- Video Embed Wrapper -->
        <div class="glass-panel rounded-2xl p-2 sm:p-3 shadow-2xl relative">
          <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-black shadow-inner border border-white/10">
            <div id="player" class="w-full h-full"></div>
          </div>

          <!-- Video Playback Controls Bar -->
          <div class="mt-3 flex items-center justify-between px-1">
            <div class="flex items-center space-x-2">
              <button onclick="togglePlay()" id="play-btn" class="bg-gradient-to-r from-bmsg-gold to-amber-500 hover:opacity-90 text-black font-black px-4 py-2 rounded-xl text-xs sm:text-sm transition flex items-center space-x-2 shadow-md">
                <i class="fa-solid fa-play" id="play-icon"></i>
                <span id="play-text">再生</span>
              </button>
              <button onclick="restartVideo()" class="bg-white/10 hover:bg-white/20 text-gray-200 font-bold px-3 py-2 rounded-xl text-xs transition border border-white/10">
                <i class="fa-solid fa-rotate-left mr-1"></i>最初から
              </button>
            </div>

            <!-- Current Time Indicator -->
            <div class="text-right">
              <div class="text-[10px] text-gray-400 font-mono uppercase tracking-wider">TIME</div>
              <div class="font-mono font-bold text-sm text-bmsg-gold" id="time-display">0:00 / 0:00</div>
            </div>
          </div>
        </div>

        <!-- Real-time Call Prompt Banner (High Legibility Display) -->
        <div class="glass-panel rounded-2xl p-4 sm:p-6 text-center relative overflow-hidden min-h-[160px] sm:min-h-[190px] flex flex-col items-center justify-center border-2 border-bmsg-accent/30 animate-glow">
          
          <div class="absolute top-3 left-4 flex items-center space-x-2">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-bmsg-accent/20 text-bmsg-accent border border-bmsg-accent/40">
              <span class="w-2 h-2 rounded-full bg-bmsg-accent mr-1.5 animate-pulse">null</span> CALL PROMPT
            </span>
          </div>

          <!-- Countdown / Warning text before upcoming call -->
          <div id="call-warning" class="text-xs sm:text-sm font-bold text-bmsg-gold mb-1 h-5 opacity-0 transition-opacity duration-300">
            <i class="fa-solid fa-circle-exclamation mr-1 animate-bounce"></i> まもなくコール！
          </div>

          <!-- Main Call Text -->
          <div id="call-display" class="text-2xl sm:text-4xl md:text-5xl font-black text-white transition-all duration-200 tracking-wider my-2 leading-tight">
            🎵 再生ボタンを押してね！
          </div>

          <!-- Call Subtitle Detail / Note -->
          <div id="call-subtext" class="text-xs sm:text-sm text-gray-400 font-bold h-5 mt-1">
            曲に合わせて元気に叫ぼう！
          </div>

        </div>

      </div>

      <div class="lg:col-span-5">
        <div class="glass-panel rounded-2xl p-4 h-[420px] lg:h-[530px] flex flex-col">
          
          <!-- Timeline Header -->
          <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-3">
            <div class="flex items-center space-x-2">
              <i class="fa-solid fa-list-ol text-bmsg-gold text-sm"></i>
              <h2 class="font-black text-sm text-white">コールタイムライン一覧</h2>
            </div>
            <span class="text-[11px] text-gray-400 font-medium">タップで即ジャンプ ⚡</span>
          </div>

          <!-- Call List (Scrollable) -->
          <div id="timeline-list" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
            <!-- Dynamically populated by JS -->
          </div>

        </div>
      </div>

    </div>

    <footer class="pt-6 border-t border-white/10 text-center text-gray-500 text-xs space-y-2">
      <p>※本アプリはファンによる非公式の応援・コール練習用Webアプリケーションです。</p>
      <p class="text-[11px]">YouTube APIを利用して公式MVを再生しており、再生回数やインプレッションは直接公式チャンネルに加算されます。</p>
    </footer>

  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // Call Data List based on precise user timestamps
    const callData = [
      { id: 0,  start: 63,  end: 66,  text: "＼ Take it back! ／", label: "1:03", note: "1サビ前" },
      { id: 1,  start: 66,  end: 69,  text: "＼ テテテTake it back! ／", label: "1:06", note: "リズムに乗って！" },
      { id: 2,  start: 77,  end: 78,  text: "＼ Take it back! ／", label: "1:17", note: "キレよく！" },
      { id: 3,  start: 78,  end: 81,  text: "＼ Take it back! ／", label: "1:18", note: "連続でシャウト！" },
      { id: 4,  start: 119, end: 123, text: "＼ Take it back! ／", label: "1:59", note: "2サビ前" },
      { id: 5,  start: 124, end: 128, text: "＼ テテテTake it back! ／", label: "2:04", note: "テテテ！" },
      { id: 6,  start: 134, end: 135, text: "＼ Take it back! ／", label: "2:14", note: "アタック！" },
      { id: 7,  start: 135, end: 138, text: "＼ Take it back! ／", label: "2:15", note: "勢いそのまま！" },
      { id: 8,  start: 159, end: 163, text: "＼ Take it back! ／", label: "2:39", note: "ラスサビ前" },
      { id: 9,  start: 163, end: 167, text: "＼ テテテTake it back! ／", label: "2:43", note: "テテテ！" },
      { id: 10, start: 174, end: 175, text: "＼ Take it back! ／", label: "2:54", note: "クライマックス！" },
      { id: 11, start: 175, end: 178, text: "＼ Take it back! ／", label: "2:55", note: "熱気最高潮！" },
      { id: 12, start: 181, end: 183, text: "＼ Take it back! ／", label: "3:01", note: "ラストスパート！" },
      { id: 13, start: 183, end: 186, text: "＼ Take it back! ／", label: "3:03", note: "決めポーズ！" }
    ];

    let player;
    let timerId = null;
    let activeCallId = null;

    // Build timeline UI items
    function buildTimeline() {
      const container = document.getElementById("timeline-list");
      container.innerHTML = "";

      callData.forEach((item) => {
        const div = document.createElement("div");
        div.id = `timeline-item-${item.id}`;
        div.onclick = () => seekToTime(item.start);
        div.className = "p-3 rounded-xl bg-black/40 border border-white/10 hover:border-bmsg-gold/50 cursor-pointer transition-all duration-200 flex items-center justify-between group";

        div.innerHTML = `
          <div class="flex items-center space-x-3">
            <span class="font-mono text-xs font-bold px-2 py-1 bg-white/10 group-hover:bg-bmsg-gold group-hover:text-black rounded-lg text-bmsg-gold transition">
              <i class="fa-solid fa-clock text-[10px] mr-1"></i>${item.label}
            </span>
            <div>
              <div class="font-black text-sm text-gray-100 group-hover:text-white">${item.text}</div>
              <div class="text-[10px] text-gray-400">${item.note}</div>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right text-xs text-gray-600 group-hover:text-bmsg-gold transition-transform group-hover:translate-x-1"></i>
        `;

        container.appendChild(div);
      });
    }

    // Initialize YouTube Player API
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: 'Nk3b5KnL4hg',
        playerVars: {
          'playsinline': 1,
          'rel': 0,
          'modestbranding': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      buildTimeline();
      updateTimeDisplay();
    }

    function onPlayerStateChange(event) {
      const playIcon = document.getElementById("play-icon");
      const playText = document.getElementById("play-text");

      if (event.data === YT.PlayerState.PLAYING) {
        playIcon.className = "fa-solid fa-pause";
        playText.innerText = "一時停止";

        if (!timerId) {
          timerId = setInterval(checkTime, 100);
        }
      } else {
        playIcon.className = "fa-solid fa-play";
        playText.innerText = "再生";

        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }
    }

    // Toggle Play/Pause
    function togglePlay() {
      if (!player || !player.getPlayerState) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    // Restart Video
    function restartVideo() {
      if (!player || !player.seekTo) return;
      player.seekTo(0, true);
      player.playVideo();
    }

    // Seek directly to timestamp
    function seekToTime(seconds) {
      if (!player || !player.seekTo) return;
      player.seekTo(seconds, true);
      player.playVideo();
    }

    // Change Playback Speed
    function changeSpeed(speedVal) {
      if (!player || !player.setPlaybackRate) return;
      player.setPlaybackRate(parseFloat(speedVal));
    }

    // Format seconds into M:SS
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Update Time Display bar
    function updateTimeDisplay() {
      if (!player || !player.getCurrentTime) return;
      const current = player.getCurrentTime() || 0;
      const total = player.getDuration() || 0;
      document.getElementById("time-display").innerText = `${formatTime(current)} / ${formatTime(total)}`;
    }

    function checkTime() {
      if (!player || !player.getCurrentTime) return;

      const currentTime = player.getCurrentTime();
      updateTimeDisplay();

      const callDisplay = document.getElementById("call-display");
      const callSubtext = document.getElementById("call-subtext");
      const callWarning = document.getElementById("call-warning");

      // Check current active call
      const currentCall = callData.find(c => currentTime >= c.start && currentTime < c.end);
      
      // Check upcoming call within 3 seconds
      const upcomingCall = callData.find(c => (c.start - currentTime > 0) && (c.start - currentTime <= 3));

      // Update Call Prompt Banner
      if (currentCall) {
        if (activeCallId !== currentCall.id) {
          activeCallId = currentCall.id;
          callDisplay.innerHTML = `<span class="glow-text-gold text-bmsg-gold scale-105 inline-block transform transition">${currentCall.text}</span>`;
          callSubtext.innerText = `${currentCall.note} 🔥`;
          callWarning.classList.add("opacity-0");

          highlightTimelineItem(currentCall.id);
        }
      } else {
        if (activeCallId !== null) {
          activeCallId = null;
          callDisplay.innerText = "（インスト / 歌聴きゾーン）";
          callDisplay.className = "text-xl sm:text-2xl font-bold text-gray-500 my-2 leading-tight";
          callSubtext.innerText = "次のコールに備えよう！";
          clearTimelineHighlights();
        }

        // Show upcoming warning banner
        if (upcomingCall) {
          const diff = (upcomingCall.start - currentTime).toFixed(1);
          callWarning.innerHTML = `<i class="fa-solid fa-circle-exclamation mr-1 animate-bounce"></i> あと ${diff} 秒でコール！ → ${upcomingCall.text}`;
          callWarning.classList.remove("opacity-0");
        } else {
          callWarning.classList.add("opacity-0");
        }
      }
    }

    // Highlight active timeline card and auto scroll into view
    function highlightTimelineItem(id) {
      clearTimelineHighlights();

      const activeItem = document.getElementById(`timeline-item-${id}`);
      if (activeItem) {
        activeItem.classList.add("active-call-card");
        activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function clearTimelineHighlights() {
      callData.forEach(item => {
        const el = document.getElementById(`timeline-item-${item.id}`);
        if (el) {
          el.classList.remove("active-call-card", "upcoming-call-card");
        }
      });
    }
  </script>
</body>
</html>
